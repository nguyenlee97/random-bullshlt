server {
    listen 80;
    listen [::]:80;
    server_name zah-4.123c.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zah-4.123c.vn;

    ssl_certificate /etc/nginx/certs/123c.vn.pem;
    ssl_certificate_key /etc/nginx/certs/123c.vn.key;

    client_max_body_size 30m;

    # The shared production Prometheus scrapes hackathon metrics directly.
    # Keep this operational endpoint off the public internet.
    location = /agent/metrics {
        allow 163.223.211.160;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
