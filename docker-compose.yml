# Phase 0 B2 — local/staging stack (docs/production-plan/01).
#
#   docker compose up -d                    → agent + backend + mongo + observability
#   docker compose --profile langfuse up -d → adds self-hosted Langfuse (needs ~4GB+ RAM;
#                                             on a small VPS use Langfuse Cloud instead and
#                                             just set LANGFUSE_* keys in agent/.env)
#
# Production migration path (⛔ don't break the demo): run this ALONGSIDE PM2 first,
# flip nginx upstreams to container ports after 48h healthy, then retire PM2.
services:
  frontend:
    build:
      context: ./agent_frontend
      args:
        VITE_AGENT_URL: /agent
        VITE_BACKEND_URL: http://localhost:3000
        VITE_ADSPILOT_URL: http://localhost:5173
        VITE_DEMO_NAMESPACE: ${DEMO_NAMESPACE:-local-demo}
    environment:
      - AGENT_API_KEY=${AGENT_API_KEY:-local-dev-agent-key}
      - MAX_AGENT_REQUEST_BYTES=${MAX_AGENT_REQUEST_BYTES:-2097152}
    ports: ["127.0.0.1:5175:80"]
    depends_on:
      agent:
        condition: service_healthy
      backend:
        condition: service_healthy
      adspilot:
        condition: service_healthy
      znews:
        condition: service_healthy
      baomoi:
        condition: service_healthy
      zingmp3:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build: ./agent
    ports: ["127.0.0.1:8080:8080"]
    env_file:
      - path: ./agent/.env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongo:27017          # container-internal mongo
      - BACKEND_URL=http://backend:3000
      - QDRANT_URL=http://qdrant:6333              # Phase 2 vector store
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - USE_CAMPAIGN_AUTOPILOT=${USE_CAMPAIGN_AUTOPILOT:-true}
      - AUTOPILOT_WORKER_POLL_SECONDS=${AUTOPILOT_WORKER_POLL_SECONDS:-0.5}
      - AUTOPILOT_TASK_LEASE_SECONDS=${AUTOPILOT_TASK_LEASE_SECONDS:-90}
      - AUTOPILOT_MAX_GENERATED_ASSETS=${AUTOPILOT_MAX_GENERATED_ASSETS:-3}
      - AUTOPILOT_CREATIVE_GENERATION_CONCURRENCY=${AUTOPILOT_CREATIVE_GENERATION_CONCURRENCY:-2}
      - CREATIVE_ANALYSIS_TIMEOUT_SECONDS=${CREATIVE_ANALYSIS_TIMEOUT_SECONDS:-15}
      - CREATIVE_WORKER_CONCURRENCY=${CREATIVE_WORKER_CONCURRENCY:-6}
      - AGENT_API_KEY=${AGENT_API_KEY:-local-dev-agent-key}
      - DEMO_NAMESPACE=${DEMO_NAMESPACE:-local-demo}
    volumes:
      - hf_cache:/root/.cache/huggingface          # embedding models survive rebuilds
      - fastembed_cache:/tmp/fastembed_cache       # actual FastEmbed model cache path
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  backend:
    build: ./backend
    ports: ["127.0.0.1:3000:3000"]
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/adspilot
      - PORT=3000
      - PUBLIC_BASE_URL=http://localhost:3000
      - SITE_URL_MODE=local
      - LOCAL_ZNEWS_URL=http://localhost:5176
      - LOCAL_BAOMOI_URL=http://localhost:5177
      - LOCAL_ZINGMP3_URL=http://localhost:5178
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  adspilot:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:5173:80"]
    volumes:
      - ./adspilot_frontend:/usr/share/nginx/html:ro
      - ./ops/nginx/static-site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  znews:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:5176:80"]
    volumes:
      - ./znews_replicate:/usr/share/nginx/html:ro
      - ./ops/nginx/static-site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  baomoi:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:5177:80"]
    volumes:
      - ./baomoi_replicate:/usr/share/nginx/html:ro
      - ./ops/nginx/static-site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  zingmp3:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:5178:80"]
    volumes:
      - ./zingmp3_replicate:/usr/share/nginx/html:ro
      - ./ops/nginx/static-site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  seed:
    build: ./backend
    command: ["sh", "-c", "node seed/index.js && node seed/seed-audience-missing.js"]
    environment:
      - MONGODB_URI=mongodb://mongo:27017/adspilot
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  mongo:
    image: mongo:8
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  qdrant:                                          # Keep server aligned with qdrant-client
    image: qdrant/qdrant:v1.12.4
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["127.0.0.1:3002:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

  # ── Langfuse self-hosted (profile: langfuse) — heavy; prefer Cloud on small VPS ──
  langfuse-db:
    image: postgres:16-alpine
    profiles: [langfuse]
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD:-langfuse}
      - POSTGRES_DB=langfuse
    volumes: [langfuse_pg:/var/lib/postgresql/data]
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    profiles: [langfuse]
    ports: ["127.0.0.1:3001:3000"]
    environment:
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-changeme-nextauth}
      - SALT=${LANGFUSE_SALT:-changeme-salt}
    depends_on: [langfuse-db]
    restart: unless-stopped

volumes:
  hf_cache:
  fastembed_cache:
  mongo_data:
  qdrant_data:
  prom_data:
  grafana_data:
  langfuse_pg:
