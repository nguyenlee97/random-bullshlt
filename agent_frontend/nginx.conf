server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # The SPA has a durable /agent entry route. Keep this exact match ahead of
    # the slash-terminated API proxy so Nginx does not redirect /agent to
    # /agent/ and accidentally send the browser to the backend root.
    location = /agent {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # UI routes live beside the /agent/* API boundary. Keep these narrow
    # matches ahead of the proxy so mode and history deep links load the SPA
    # without intercepting API paths such as /agent/autopilot/runs.
    location = /agent/autopilot {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/agent/(copilot|autopilot)/history/[^/]+/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Backend-for-frontend boundary. The browser never receives AGENT_API_KEY;
    # the official Nginx entrypoint substitutes it into this server-side config.
    # The trailing slash strips /agent before forwarding, so
    # /agent/api/agent/chat becomes /api/agent/chat upstream.
    location /agent/ {
        proxy_pass http://agent:8080/;
        proxy_http_version 1.1;
        proxy_set_header X-API-Key "${AGENT_API_KEY}";
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The hackathon deployment uses one verified host. Keep every browser
    # surface on that origin while preserving clean service boundaries.
    location /backend/ {
        proxy_pass http://backend:3000/;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location = /adspilot { return 301 /adspilot/; }
    location /adspilot/ {
        proxy_pass http://adspilot/;
        proxy_set_header Host $host;
        sub_filter_types text/css application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'https://api.pawgrammers.io.vn/api' '/api';
        sub_filter '</head>' '<script>window.__ADSTACK_CONFIG__={apiBase:"/api",allowFallbackAds:false,topicAssetBase:"/znews/assets/np6-topics"};</script></head>';
    }

    location = /analytics { return 301 /analytics/; }
    location /analytics/ {
        proxy_pass http://analytics/;
        proxy_set_header Host $host;
        sub_filter_types text/css application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'https://api.pawgrammers.io.vn/api' '/api';
        sub_filter '</head>' '<script>window.__ADSTACK_CONFIG__={apiBase:"/api",allowFallbackAds:false,topicAssetBase:"/znews/assets/np6-topics"};</script></head>';
    }

    location = /znews { return 301 /znews/; }
    location /znews/ {
        proxy_pass http://znews/;
        proxy_set_header Host $host;
        sub_filter_types text/css application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'https://api.pawgrammers.io.vn/api' '/api';
        sub_filter '</head>' '<script>window.__ADSTACK_CONFIG__={apiBase:"/api",allowFallbackAds:true,topicAssetBase:"/znews/assets/np6-topics"};</script></head>';
    }

    location = /baomoi { return 301 /baomoi/; }
    location /baomoi/ {
        proxy_pass http://baomoi/;
        proxy_set_header Host $host;
        sub_filter_types text/css application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'https://api.pawgrammers.io.vn/api' '/api';
        sub_filter 'https://znews-stg.pawgrammers.io.vn/assets/np6-topics' '/znews/assets/np6-topics';
        sub_filter '</head>' '<script>window.__ADSTACK_CONFIG__={apiBase:"/api",allowFallbackAds:true,topicAssetBase:"/znews/assets/np6-topics"};</script></head>';
    }

    location = /zingmp3 { return 301 /zingmp3/; }
    location /zingmp3/ {
        proxy_pass http://zingmp3/;
        proxy_set_header Host $host;
        sub_filter_types text/css application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'https://api.pawgrammers.io.vn/api' '/api';
        sub_filter '</head>' '<script>window.__ADSTACK_CONFIG__={apiBase:"/api",allowFallbackAds:true,topicAssetBase:"/znews/assets/np6-topics"};</script></head>';
    }

    location = /smoney { return 301 /smoney/; }
    location /smoney/ {
        proxy_pass http://smoney/;
        proxy_set_header Host $host;
        sub_filter_types text/css application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'https://api.pawgrammers.io.vn/api' '/api';
        sub_filter '</head>' '<script>window.__ADSTACK_CONFIG__={apiBase:"/api",allowFallbackAds:true,topicAssetBase:"/znews/assets/np6-topics"};</script></head>';
    }

    location = /dicungcon { return 301 /dicungcon/; }
    location /dicungcon/ {
        proxy_pass http://dicungcon/;
        proxy_set_header Host $host;
        sub_filter_types text/css application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'https://api.pawgrammers.io.vn/api' '/api';
        sub_filter '</head>' '<script>window.__ADSTACK_CONFIG__={apiBase:"/api",allowFallbackAds:true,topicAssetBase:"/znews/assets/np6-topics"};</script></head>';
    }

    location = /zagoo { return 301 /zagoo/; }
    location /zagoo/ {
        proxy_pass http://zagoo/;
        proxy_set_header Host $host;
        sub_filter_types text/css application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'https://api.pawgrammers.io.vn/api' '/api';
        sub_filter 'https://znews-stg.pawgrammers.io.vn/assets/np6-topics' '/znews/assets/np6-topics';
        sub_filter '</head>' '<script>window.__ADSTACK_CONFIG__={apiBase:"/api",allowFallbackAds:true,topicAssetBase:"/znews/assets/np6-topics"};</script></head>';
    }

    # A rebuilt SPA must not leave an old tab resolving a deleted JS chunk to
    # index.html. Missing immutable assets are real 404s; the HTML shell is
    # always revalidated so a refresh receives the current asset manifest.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        # Without "always", only successful fingerprinted assets are cached;
        # a transient 404 during a deployment can be retried after refresh.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
