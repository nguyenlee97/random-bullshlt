server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Backend-for-frontend boundary. The browser never receives AGENT_API_KEY;
    # the official Nginx entrypoint substitutes it into this server-side config.
    # The trailing slash strips /agent before forwarding, so
    # /agent/api/agent/chat becomes /api/agent/chat upstream.
    location /agent/ {
        proxy_pass http://agent:8080/;
        proxy_http_version 1.1;
        proxy_set_header X-API-Key "${AGENT_API_KEY}";
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
